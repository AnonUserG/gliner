services:
  ner-gliner:
    build: .
    image: ner-gliner:1.0
    container_name: ner-gliner
    ports:
      - "8000:8000"
    environment:
      # Модель GLiNER (должна быть запечена в образ для офлайн-режима)
      MODEL_NAME: urchade/gliner_multi-v2.1
      # Число воркеров uvicorn — каждый держит отдельную копию модели (~1.5 GB RAM)
      WORKERS: 1
      # Уровень логирования: DEBUG, INFO, WARNING, ERROR...
      LOG_LEVEL: INFO
      # threshold по умолчанию, если он не передан в запросе
      DEFAULT_THRESHOLD: "0.5"
      # Размер чанка (в словах) для разбиения длинных текстов
      CHUNK_SIZE_WORDS: 300
      # Максимальная длина text / элемента texts в символах. Пусто = без ограничений
      MAX_TEXT_LENGTH: ""
      # Максимальное число элементов texts в /extract_batch. Пусто = без ограничений
      MAX_BATCH_SIZE: 10
      # Максимальное число элементов labels (до дедупликации). Пусто = без ограничений
      MAX_LABELS: 10
      # Адрес Zipkin-коллектора. Внутри docker-сети — по имени сервиса, не по внешнему порту
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      # Имя сервиса в Zipkin/Grafana
      OTEL_SERVICE_NAME: ner-gliner
    depends_on:
      - zipkin

  zipkin:
    image: openzipkin/zipkin:3.5.1
    container_name: zipkin
    ports:
      - "9411:9411"

  prometheus:
    image: prom/prometheus:v3.9.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - ner-gliner

  loki:
    image: grafana/loki:3.6.3
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.12.2
    container_name: alloy
    ports:
      - "12345:12345"
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.6.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/ner-gliner-dashboard.json:/var/lib/grafana/dashboards/ner-gliner-dashboard.json:ro
      - ./grafana/ner-gliner-process-dashboard.json:/var/lib/grafana/dashboards/ner-gliner-process-dashboard.json:ro
    depends_on:
      - prometheus
      - loki
      - zipkin

volumes:
  loki-data:
